version: "3.8"

# Local dev stack for Line Watch: Kafka -> Spark Streaming -> HDFS/Hive.
# Not smoke-tested in CI yet (no Docker in the dev sandbox this was scaffolded in) --
# first person to run `docker compose up` should report any image/config issues in the PR.

services:
  # ---- Kafka (KRaft mode, single broker -- no Zookeeper needed) ----
  kafka:
    image: bitnami/kafka:3.6
    container_name: linewatch-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - ALLOW_PLAINTEXT_LISTENER=yes
    volumes:
      - kafka_data:/bitnami/kafka

  # ---- HDFS ----
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: linewatch-namenode
    env_file:
      - hadoop-hive.env
    environment:
      - CLUSTER_NAME=linewatch
    ports:
      - "9870:9870" # HDFS web UI
    volumes:
      - hadoop_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: linewatch-datanode
    env_file:
      - hadoop-hive.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data

  # ---- Hive ----
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: linewatch-hive-metastore-db
    volumes:
      - hive_metastore_postgresql:/var/lib/postgresql/data

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: linewatch-hive-metastore
    env_file:
      - hadoop-hive.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864 hive-metastore-postgresql:5432
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: linewatch-hive-server
    env_file:
      - hadoop-hive.env
    environment:
      - SERVICE_PRECONDITION=hive-metastore:9083
    ports:
      - "10000:10000" # JDBC / beeline
      - "10002:10002" # Hive web UI
    depends_on:
      - hive-metastore

  # ---- Spark (standalone cluster, not YARN) ----
  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    container_name: linewatch-spark-master
    ports:
      - "8080:8080" # Spark master web UI
      - "7077:7077" # Spark master port
    volumes:
      - ./:/workspace

  spark-worker:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    container_name: linewatch-spark-worker
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Spark worker web UI
    volumes:
      - ./:/workspace

volumes:
  kafka_data:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_postgresql:
