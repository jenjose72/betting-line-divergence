# Local dev stack for Line Watch: Kafka -> Spark Streaming -> HDFS/Hive.
# First person to run `docker compose up` should report any image/config issues in the PR.

services:
  # ---- Kafka (Confluent images: Zookeeper + broker) ----
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: linewatch-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: linewatch-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    volumes:
      - kafka_data:/var/lib/kafka/data

  # ---- HDFS ----
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: linewatch-namenode
    env_file:
      - hadoop-hive.env
    environment:
      - CLUSTER_NAME=linewatch
    ports:
      - "9870:9870" # HDFS web UI
    volumes:
      - hadoop_namenode:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: linewatch-datanode
    env_file:
      - hadoop-hive.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    depends_on:
      - namenode
    volumes:
      - hadoop_datanode:/hadoop/dfs/data

  # ---- Hive ----
  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    container_name: linewatch-hive-metastore-db
    volumes:
      - hive_metastore_postgresql:/var/lib/postgresql/data

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: linewatch-hive-metastore
    env_file:
      - hadoop-hive.env
    environment:
      - SERVICE_PRECONDITION=namenode:9870 datanode:9864 hive-metastore-postgresql:5432
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql

  hive-server:
    image: bde2020/hive:2.3.2-postgresql-metastore
    container_name: linewatch-hive-server
    env_file:
      - hadoop-hive.env
    environment:
      - SERVICE_PRECONDITION=hive-metastore:9083
    ports:
      - "10000:10000" # JDBC / beeline
      - "10002:10002" # Hive web UI
    depends_on:
      - hive-metastore

  # ---- Spark (standalone cluster, not YARN) ----
  spark-master:
    image: bde2020/spark-master:3.1.1-hadoop3.2
    container_name: linewatch-spark-master
    ports:
      - "8080:8080" # Spark master web UI
      - "7077:7077" # Spark master port
    volumes:
      - ./:/workspace

  spark-worker:
    image: bde2020/spark-worker:3.1.1-hadoop3.2
    container_name: linewatch-spark-worker
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Spark worker web UI
    volumes:
      - ./:/workspace

volumes:
  kafka_data:
  hadoop_namenode:
  hadoop_datanode:
  hive_metastore_postgresql:
